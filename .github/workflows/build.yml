# Builds Segno.exe on Windows for every push.
#
# To publish a release (which is what the in-app updater finds), either:
# - open Actions > Build > Run workflow, tick "Publish a release", and run it, or
# - push a version tag like v1.0.1.
# Either way the version comes from Cargo.toml.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release with the version in Cargo.toml"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Read the version
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::The tag is $GITHUB_REF_NAME but Cargo.toml says $version. Change one so they match."
            exit 1
          fi
          if [[ "${{ inputs.publish }}" == "true" ]] && git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::Version $version is already released. Raise the version in Cargo.toml first."
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked

      - name: Name the exe
        shell: bash
        run: |
          mkdir dist
          cp target/release/segno.exe dist/Segno.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Segno
          path: dist/Segno.exe

      # The Microsoft Store package. The Store signs it, so it needs no certificate here.
      # Upload Segno.msix in Partner Center. Without the MSIX_* repository variables it still
      # builds (with test values) so the packaging is checked on every push.
      - name: Build for the Microsoft Store
        run: cargo build --release --locked --features store

      - name: Pack Segno.msix
        shell: pwsh
        env:
          MSIX_NAME: ${{ vars.MSIX_NAME || 'Segno.Test' }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=Segno Test' }}
          MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_NAME || 'Segno Test' }}
        run: |
          $pkg = "msix-pkg"
          New-Item -ItemType Directory -Force "$pkg/Assets" | Out-Null
          Copy-Item target/release/segno.exe "$pkg/Segno.exe"
          Copy-Item packaging/msix/Assets/* "$pkg/Assets/"
          $m = Get-Content packaging/msix/AppxManifest.xml -Raw
          $m = $m.Replace('{NAME}', $env:MSIX_NAME).Replace('{PUBLISHER}', $env:MSIX_PUBLISHER)
          $m = $m.Replace('{PUBLISHER_NAME}', $env:MSIX_PUBLISHER_NAME).Replace('{VERSION}', '${{ steps.version.outputs.version }}')
          Set-Content -Path "$pkg/AppxManifest.xml" -Value $m -Encoding utf8
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found" }
          & $makeappx.FullName pack /d $pkg /p dist/Segno.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: Segno-msix
          path: dist/Segno.msix

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Segno ${{ steps.version.outputs.version }}
          files: dist/Segno.exe
          generate_release_notes: true
          body: |
            Download **Segno.exe** below and run it. No installer needed.

            Windows may say "Windows protected your PC" because Segno is new and unsigned. Click **More info**, then **Run anyway**.

            Already using Segno? It updates itself.
